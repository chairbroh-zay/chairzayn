<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chairil Ibrahim · Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== COPY STYLE DARI KODE SEBELUMNYA ===== */
        /* ... (style yang sama seperti portfolio sebelumnya) ... */
        /* TAPI tambahan: loading spinner */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50vh;
            font-size: 18px;
            color: var(--text-muted);
        }
        .loading i {
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- ===== LOADING ===== -->
    <div id="loading" class="loading">
        <i class="fas fa-spinner"></i> Memuat data...
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div id="mainContent" style="display:none;">
        <!-- Semua konten portfolio seperti sebelumnya, tapi di-render dari JavaScript -->
        <!-- Untuk memudahkan, kita render semua dari JS -->
    </div>

    <script>
        // ============================================================
        // KONFIGURASI GITHUB
        // ============================================================
        const REPO_OWNER = 'chairbroh-zay';      // Ganti dengan username GitHub mu
        const REPO_NAME = 'portfolio-data';      // Ganti dengan nama repo mu
        const FILE_PATH = 'data.json';
        const GITHUB_TOKEN = ''; // Token diisi di admin.html, tidak perlu di sini

        // ============================================================
        // FUNGSI AMBIL DATA
        // ============================================================
        async function getData() {
            const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('Gagal mengambil data');
            return await res.json();
        }

        // ============================================================
        // RENDER PORTFOLIO
        // ============================================================
        async function renderPortfolio() {
            try {
                const data = await getData();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
                // Render Home, About, Projects, Certificates
                renderHome(data.home);
                renderAbout(data.about);
                renderProjects(data.projects);
                renderCertificates(data.certificates);
                
            } catch (error) {
                document.getElementById('loading').innerHTML = `
                    <i class="fas fa-exclamation-circle"></i> 
                    Gagal memuat data: ${error.message}
                    <br><br>
                    <button onclick="location.reload()" style="padding:10px 24px;border-radius:8px;border:none;background:#00BCD4;color:#fff;cursor:pointer;">
                        <i class="fas fa-sync"></i> Coba Lagi
                    </button>
                `;
            }
        }

        function renderHome(home) {
            document.getElementById('page-home').innerHTML = `
                <div class="hero">
                    <div class="container">
                        <div class="hero-photo">
                            <div class="photo-wrapper">
                                <img src="fotoprofile.jpg" alt="Foto ${home.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(home.name)}&size=280&background=0A0A0A&color=00BCD4&bold=true&rounded=false'" />
                            </div>
                        </div>
                        <div class="hero-content">
                            <div class="hero-badge">
                                <span class="dot"></span> ${home.badge}
                            </div>
                            <h1>Halo, saya <br /><span class="name">${home.name}</span></h1>
                            <div class="typing-wrapper">
                                <span class="typing-text" id="typingText"></span>
                            </div>
                            <p class="hero-subtitle">
                                <strong>TTL:</strong> ${home.ttl} &middot;
                                <strong>Sekolah:</strong> ${home.school}<br />
                                <strong>Jurusan:</strong> ${home.major}
                            </p>
                            <div class="status-indicator">
                                <span class="status-dot"></span> ${home.status}
                            </div>
                        </div>
                        <div class="hero-extra-photo">
                            <div class="extra-wrapper">
                                <img src="foto1.png" alt="Foto karakter" onerror="this.style.display='none'" />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="counter-grid">
                    <div class="counter-item">
                        <div class="number" data-count="${document.querySelectorAll('.project-card-home').length || 4}">0</div>
                        <div class="label"><i class="fas fa-folder-open"></i> Project</div>
                    </div>
                    <div class="counter-item">
                        <div class="number" data-count="9">0</div>
                        <div class="label"><i class="fas fa-code"></i> Hard Skill</div>
                    </div>
                    <div class="counter-item">
                        <div class="number" data-count="6">0</div>
                        <div class="label"><i class="fas fa-handshake"></i> Soft Skill</div>
                    </div>
                    <div class="counter-item">
                        <div class="number" data-count="3">0</div>
                        <div class="label"><i class="fas fa-certificate"></i> Sertifikat</div>
                    </div>
                </div>
            `;
            
            // Typing effect
            const words = ['Siswa TJKT SMKN 1 Losarang', 'Network Enthusiast', 'Web Developer', 'Python & Linux Learner'];
            let i = 0, j = 0, isDeleting = false;
            const typingText = document.getElementById('typingText');
            function typeEffect() {
                const current = words[i];
                if (isDeleting) {
                    typingText.textContent = current.substring(0, j - 1);
                    j--;
                } else {
                    typingText.textContent = current.substring(0, j + 1);
                    j++;
                }
                let speed = isDeleting ? 40 : 60;
                if (!isDeleting && j === current.length) { speed = 2000; isDeleting = true; }
                else if (isDeleting && j === 0) { isDeleting = false; i = (i + 1) % words.length; speed = 500; }
                setTimeout(typeEffect, speed);
            }
            setTimeout(typeEffect, 1000);
            
            // Counter animation
            setTimeout(() => {
                document.querySelectorAll('.counter-item .number').forEach(c => {
                    const target = parseInt(c.dataset.count);
                    let current = 0;
                    const interval = setInterval(() => {
                        current += Math.ceil(target / 40);
                        if (current >= target) { c.textContent = target; clearInterval(interval); }
                        else c.textContent = current;
                    }, 30);
                });
            }, 500);
        }

        function renderAbout(about) {
            document.getElementById('page-about').innerHTML = `
                <div class="section">
                    <span class="section-label">Tentang Saya</span>
                    <h2 class="section-title">Kenali <span class="highlight">lebih dekat</span></h2>
                    <div class="about-grid">
                        <div class="about-text">
                            <p>${about.bio}</p>
                            <p class="motto">"${about.motto}"</p>
                        </div>
                        <div class="skills-section">
                            <div>
                                <h4><i class="fas fa-tools"></i> Hard Skill</h4>
                                ${about.hardSkills.map(s => `
                                    <div class="skill-item">
                                        <div class="skill-label">
                                            <span>${s.name}</span>
                                            <span class="skill-percent">${s.percent}%</span>
                                        </div>
                                        <div class="skill-bar">
                                            <div class="skill-fill" style="--percent: ${s.percent}%;"></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div>
                                <h4><i class="fas fa-brain"></i> Soft Skill</h4>
                                <div class="soft-skills">
                                    ${about.softSkills.map(s => `<span>${s}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            // Animate skill bars
            setTimeout(() => {
                document.querySelectorAll('.skill-fill').forEach(el => {
                    el.style.width = el.style.getPropertyValue('--percent');
                });
            }, 300);
        }

        function renderProjects(projects) {
            const tkjProjects = projects.filter(p => p.category === 'TKJ');
            const sijaProjects = projects.filter(p => p.category === 'SIJA');
            
            document.getElementById('page-project').innerHTML = `
                <div class="section">
                    <span class="section-label">Portofolio</span>
                    <h2 class="section-title">Proyek <span class="highlight">Saya</span></h2>
                    
                    <div class="project-tabs">
                        <button class="project-tab" data-sub="pa-aan"><i class="fas fa-folder"></i> Tugas Pa Aan</button>
                        <button class="project-tab active-tab" data-sub="pa-abas"><i class="fas fa-folder-open"></i> Tugas Pa Abas</button>
                    </div>
                    
                    <div class="project-subpage" id="sub-pa-aan">
                        <div class="coming-soon">
                            <div class="coming-icon"><i class="fas fa-clock"></i></div>
                            <h3>Segera Hadir</h3>
                            <p>Project dari Tugas Pa Aan sedang dalam proses pengumpulan foto dan dokumentasi.</p>
                        </div>
                    </div>
                    
                    <div class="project-subpage active-sub" id="sub-pa-abas">
                        <div class="sub-tabs">
                            <button class="sub-tab active-sub" data-subcontent="tkj">
                                <i class="fas fa-server"></i> Komputer & Jaringan
                            </button>
                            <button class="sub-tab" data-subcontent="sija">
                                <i class="fas fa-code"></i> SIJA
                            </button>
                        </div>
                        
                        <div class="sub-content active-sub-content" id="sub-tkj">
                            <div class="project-grid">
                                ${tkjProjects.map(p => `
                                    <div class="project-card">
                                        <div class="glow-border"></div>
                                        <div class="project-thumb">
                                            ${p.image ? `<img src="${p.image}" alt="${p.title}" />` : `<i class="fas fa-network-wired"></i>`}
                                        </div>
                                        <div class="project-date"><i class="far fa-calendar-alt"></i> ${p.date || 'TKJ'}</div>
                                        <h4>${p.title}</h4>
                                        <p class="project-desc">${p.desc}</p>
                                        <div class="project-tech">
                                            ${p.tech.map(t => `<span>${t}</span>`).join('')}
                                        </div>
                                        <a href="${p.link}" target="_blank" class="project-link">
                                            <i class="fas fa-external-link-alt"></i> Kunjungi
                                        </a>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        
                        <div class="sub-content" id="sub-sija">
                            <div class="project-grid">
                                ${sijaProjects.map(p => `
                                    <div class="project-card">
                                        <div class="glow-border"></div>
                                        <div class="project-thumb">
                                            ${p.image ? `<img src="${p.image}" alt="${p.title}" />` : `<i class="fas fa-code"></i>`}
                                        </div>
                                        <div class="project-date"><i class="far fa-calendar-alt"></i> ${p.date || 'SIJA'}</div>
                                        <h4>${p.title}</h4>
                                        <p class="project-desc">${p.desc}</p>
                                        <div class="project-tech">
                                            ${p.tech.map(t => `<span>${t}</span>`).join('')}
                                        </div>
                                        <a href="${p.link}" target="_blank" class="project-link">
                                            <i class="fas fa-external-link-alt"></i> Kunjungi
                                        </a>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Project tabs
            document.querySelectorAll('.project-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.project-tab').forEach(t => t.classList.remove('active-tab'));
                    this.classList.add('active-tab');
                    document.querySelectorAll('.project-subpage').forEach(p => p.classList.remove('active-sub'));
                    document.getElementById('sub-' + this.dataset.sub).classList.add('active-sub');
                });
            });
            
            // Sub tabs
            document.querySelectorAll('.sub-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active-sub'));
                    this.classList.add('active-sub');
                    document.querySelectorAll('.sub-content').forEach(c => c.classList.remove('active-sub-content'));
                    document.getElementById('sub-' + this.dataset.subcontent).classList.add('active-sub-content');
                });
            });
        }

        function renderCertificates(certificates) {
            document.getElementById('page-certificate').innerHTML = `
                <div class="section">
                    <span class="section-label">Sertifikasi</span>
                    <h2 class="section-title">Sertifikat <span class="highlight">Kompetensi</span></h2>
                    <div class="cert-grid">
                        ${certificates.map(c => `
                            <div class="cert-card">
                                <div class="cert-card-inner">
                                    <div class="cert-card-front">
                                        <span class="cert-icon"><i class="fas ${c.icon}"></i></span>
                                        <h4>${c.name}</h4>
                                        <p>${c.level} · ${c.desc}</p>
                                        <span class="cert-badge"><i class="fas fa-check"></i> Tersertifikasi</span>
                                    </div>
                                    <div class="cert-card-back">
                                        <span class="back-icon"><i class="fas fa-trophy"></i></span>
                                        <p>${c.name} - ${c.level}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // ============================================================
        // INIT
        // ============================================================
        renderPortfolio();
    </script>
</body>
</html>
