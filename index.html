<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chairil Ibrahim · Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== ROOT VARIABLES (Sama Seperti Sebelumnya) ===== */
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0A0A0A;
            --bg-card: rgba(17, 17, 17, 0.7);
            --bg-card-hover: rgba(26, 26, 26, 0.9);
            --bg-navbar: rgba(0, 0, 0, 0.8);
            --text-primary: #FFFFFF;
            --text-secondary: #AAAAAA;
            --text-muted: #666666;
            --text-inverse: #000000;
            --border-color: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.15);
            --gradient-start: #00BCD4;
            --gradient-end: #26A69A;
            --gradient-bg: linear-gradient(135deg, #00BCD4, #26A69A);
            --shadow-sm: 0 2px 20px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 40px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 60px rgba(0, 188, 212, 0.25);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --max-width: 1100px;
            --navbar-height: 64px;
        }
        
        /* ===== LIGHT MODE ===== */
        [data-theme="light"] {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F5F5;
            --bg-card: rgba(240, 240, 240, 0.7);
            --bg-card-hover: rgba(232, 232, 232, 0.9);
            --bg-navbar: rgba(255, 255, 255, 0.9);
            --text-primary: #000000;
            --text-secondary: #444444;
            --text-muted: #888888;
            --text-inverse: #FFFFFF;
            --border-color: rgba(0, 0, 0, 0.06);
            --border-hover: rgba(0, 0, 0, 0.12);
            --shadow-sm: 0 2px 20px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 40px rgba(0, 0, 0, 0.06);
            --shadow-glow: 0 0 60px rgba(0, 188, 212, 0.12);
        }
        
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.4s ease;
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding-top: var(--navbar-height);
            overflow-x: hidden;
        }
        ::selection { background: var(--gradient-start); color: var(--text-inverse); }
        
        /* ===== PARTICLE BACKGROUND ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }
        
        /* ===== GRADIENT ORB ===== */
        .gradient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
            animation: floatOrb 20s ease-in-out infinite alternate;
        }
        .gradient-orb.orb1 { width: 400px; height: 400px; background: var(--gradient-bg); top: -10%; right: -5%; animation-delay: 0s; }
        .gradient-orb.orb2 { width: 300px; height: 300px; background: var(--gradient-bg); bottom: -5%; left: -5%; animation-delay: -7s; opacity: 0.2; }
        .gradient-orb.orb3 { width: 200px; height: 200px; background: var(--gradient-bg); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -14s; opacity: 0.1; }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.9); }
            100% { transform: translate(10px, -10px) scale(1.05); }
        }
        
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--gradient-start); border-radius: 10px; }
        
        /* ===== LOADING ===== */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            font-size: 18px;
            color: var(--text-muted);
            z-index: 10;
            position: relative;
        }
        .loading i { animation: spin 1s linear infinite; margin-right: 12px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--navbar-height);
            background: var(--bg-navbar);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            transition: var(--transition);
        }
        .navbar .logo {
            font-size: 20px;
            font-weight: 900;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar .logo .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--gradient-bg);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-inverse);
        }
        .navbar .logo span { color: var(--text-muted); font-weight: 300; }
        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
        }
        .navbar .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar .nav-links a i { font-size: 14px; opacity: 0.5; }
        .navbar .nav-links a:hover { color: var(--text-primary); background: var(--bg-card); }
        .navbar .nav-links a:hover i { opacity: 1; color: var(--gradient-start); }
        .navbar .nav-links a.active { color: var(--text-primary); background: var(--bg-card); }
        .navbar .nav-links a.active i { opacity: 1; color: var(--gradient-start); }
        .navbar .nav-links a .badge {
            font-size: 9px;
            background: var(--gradient-bg);
            color: var(--text-inverse);
            padding: 1px 8px;
            border-radius: 100px;
            font-weight: 600;
            opacity: 0.6;
        }
        .navbar .nav-links a.active .badge { opacity: 1; }
        .navbar .nav-actions { display: flex; align-items: center; gap: 12px; }
        .navbar .theme-toggle-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .navbar .theme-toggle-btn:hover { border-color: var(--gradient-start); color: var(--text-primary); transform: rotate(30deg); }
        
        /* ===== MOBILE HEADER ===== */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--navbar-height);
            background: var(--bg-navbar);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }
        .mobile-header .logo {
            font-size: 18px;
            font-weight: 900;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mobile-header .logo .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--gradient-bg);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-inverse);
        }
        .mobile-header .logo span { color: var(--text-muted); font-weight: 300; }
        .mobile-header .header-actions { display: flex; align-items: center; gap: 8px; }
        .burger-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .burger-btn:hover { border-color: var(--gradient-start); }
        .mobile-theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .mobile-theme-btn:hover { border-color: var(--gradient-start); color: var(--text-primary); }
        
        /* ===== MOBILE SIDEBAR ===== */
        .mobile-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 50%;
            max-width: 320px;
            height: 100%;
            z-index: 1001;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .mobile-sidebar.open { transform: translateX(0); }
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .mobile-sidebar .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }
        .mobile-sidebar .sidebar-header .sidebar-logo { font-size: 18px; font-weight: 900; color: var(--text-primary); }
        .mobile-sidebar .sidebar-header .sidebar-logo span { color: var(--text-muted); font-weight: 300; }
        .mobile-sidebar .sidebar-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .mobile-sidebar .sidebar-close:hover { border-color: var(--gradient-start); color: var(--text-primary); }
        .mobile-sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }
        .mobile-sidebar nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mobile-sidebar nav a i { width: 20px; font-size: 16px; opacity: 0.5; }
        .mobile-sidebar nav a:hover { color: var(--text-primary); background: var(--bg-card); }
        .mobile-sidebar nav a:hover i { opacity: 1; color: var(--gradient-start); }
        .mobile-sidebar nav a.active { color: var(--text-primary); background: var(--bg-card); }
        .mobile-sidebar nav a.active i { opacity: 1; color: var(--gradient-start); }
        .mobile-sidebar nav a .badge {
            margin-left: auto;
            font-size: 10px;
            background: var(--gradient-bg);
            color: var(--text-inverse);
            padding: 1px 10px;
            border-radius: 100px;
            font-weight: 600;
            opacity: 0.6;
        }
        .mobile-sidebar nav a.active .badge { opacity: 1; }
        .mobile-sidebar .sidebar-footer {
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }
        .mobile-sidebar .sidebar-footer .sidebar-theme-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }
        .mobile-sidebar .sidebar-footer .sidebar-theme-toggle span { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .mobile-sidebar .sidebar-footer .sidebar-theme-toggle .theme-switch {
            position: relative;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
        }
        .mobile-sidebar .sidebar-footer .sidebar-theme-toggle .theme-switch input { opacity: 0; width: 0; height: 0; }
        .mobile-sidebar .sidebar-footer .sidebar-theme-toggle .theme-switch .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            transition: var(--transition);
        }
        .mobile-sidebar .sidebar-footer .sidebar-theme-toggle .theme-switch .slider::before {
            content: '';
            position: absolute;
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: var(--transition);
        }
        .mobile-sidebar .sidebar-footer .sidebar-theme-toggle .theme-switch input:checked+.slider {
            background: var(--gradient-start);
            border-color: var(--gradient-start);
        }
        .mobile-sidebar .sidebar-footer .sidebar-theme-toggle .theme-switch input:checked+.slider::before {
            transform: translateX(18px);
            background: var(--text-inverse);
        }
        
        /* ===== SHOW/HIDE NAVBAR ===== */
        @media (min-width: 769px) {
            .mobile-header { display: none !important; }
            .mobile-sidebar { display: none !important; }
            .sidebar-overlay { display: none !important; }
            .navbar { display: flex !important; }
        }
        @media (max-width: 768px) {
            .navbar { display: none !important; }
            .mobile-header { display: flex !important; }
        }
        
        /* ===== MAIN CONTENT ===== */
        .main-content {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 20px 24px 40px;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }
        @media (max-width: 768px) { .main-content { padding: 16px 16px 40px; } }
        
        /* ===== PAGES ===== */
        .page { display: none; animation: fadeUp 0.6s ease; }
        .page.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        
        .section {
            padding: 40px 0;
            border-bottom: 1px solid var(--border-color);
            scroll-margin-top: 20px;
        }
        .section:last-of-type { border-bottom: none; }
        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .section-title {
            font-size: clamp(26px, 3.5vw, 38px);
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 10px;
        }
        .section-title .highlight {
            background: var(--gradient-bg);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 8px 0 16px;
            opacity: 0.3;
        }
        .divider .line { flex: 1; height: 1px; background: var(--border-color); }
        .divider .icon { color: var(--gradient-start); font-size: 14px; }
        
        /* ===== HERO ===== */
        .hero {
            min-height: 60vh;
            display: flex;
            align-items: center;
            position: relative;
            padding: 10px 0;
            overflow: hidden;
        }
        .hero .container {
            display: grid;
            grid-template-columns: 1fr 1.4fr 0.6fr;
            gap: 20px;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 2;
        }
        
        .hero-photo {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
            z-index: 3;
        }
        .hero-photo .photo-wrapper {
            width: 200px;
            height: 200px;
            position: relative;
            animation: floatPhoto 4s ease-in-out infinite;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }
        @keyframes floatPhoto { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
        .hero-photo .photo-wrapper::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: var(--radius-md);
            padding: 3px;
            background: var(--gradient-bg);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.6;
            animation: glowPulse 2.5s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes glowPulse { 0%, 100% { opacity: 0.4; box-shadow: 0 0 30px rgba(0, 188, 212, 0.2); } 50% { opacity: 1; box-shadow: 0 0 60px rgba(0, 188, 212, 0.5); } }
        .hero-photo .photo-wrapper::after {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: var(--radius-md);
            background: var(--gradient-bg);
            opacity: 0.08;
            filter: blur(30px);
            z-index: -1;
            animation: glowBlur 3s ease-in-out infinite alternate;
        }
        @keyframes glowBlur { 0% { opacity: 0.05; transform: scale(0.95); } 100% { opacity: 0.15; transform: scale(1.05); } }
        .hero-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: var(--transition-bounce);
            position: relative;
            z-index: 1;
            backface-visibility: hidden;
            will-change: transform;
        }
        .hero-photo .photo-wrapper.tilt-effect {
            transition: transform 0.1s ease;
            transform: rotateX(var(--rotateX, 0deg)) rotateY(var(--rotateY, 0deg));
        }
        
        .floating-icons {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
        }
        .floating-icons span {
            position: absolute;
            font-size: 18px;
            animation: floatIcon 6s ease-in-out infinite;
            opacity: 0.5;
            color: var(--gradient-start);
        }
        .floating-icons span:nth-child(1) { top: -8%; left: -8%; animation-delay: 0s; }
        .floating-icons span:nth-child(2) { top: -8%; right: -8%; animation-delay: -2s; }
        .floating-icons span:nth-child(3) { bottom: -8%; left: -8%; animation-delay: -4s; }
        .floating-icons span:nth-child(4) { bottom: -8%; right: -8%; animation-delay: -1s; }
        .floating-icons span:nth-child(5) { top: 50%; left: -12%; animation-delay: -3s; }
        .floating-icons span:nth-child(6) { top: 50%; right: -12%; animation-delay: -5s; }
        @keyframes floatIcon {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(10px, -15px) rotate(10deg) scale(1.1); }
            50% { transform: translate(-5px, 10px) rotate(-5deg) scale(0.9); }
            75% { transform: translate(15px, 5px) rotate(15deg) scale(1.05); }
        }
        
        .hero-extra-photo {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 50%;
            height: 75vh;
            max-height: 550px;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            animation: slideFromRight 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 0.3s;
        }
        @keyframes slideFromRight { 0% { opacity: 0; transform: translateY(-50%) translateX(100%); } 100% { opacity: 1; transform: translateY(-50%) translateX(0); } }
        .hero-extra-photo .extra-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
        }
        .hero-extra-photo .extra-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: right center;
            border: none;
            background: transparent;
            border-radius: 0;
            filter: brightness(0.95) contrast(1.05) saturate(1);
            opacity: 0.7;
            transition: var(--transition-slow);
            position: relative;
            z-index: 1;
        }
        .hero-extra-photo .extra-wrapper::before {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(ellipse at center right, rgba(0, 188, 212, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
            filter: blur(50px);
        }
        .hero-extra-photo::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 30%;
            height: 100%;
            background: linear-gradient(to right, var(--bg-primary) 0%, transparent 100%);
            pointer-events: none;
            z-index: 2;
        }
        @media (max-width: 768px) { .hero-extra-photo { display: none !important; } }
        
        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px 0;
            position: relative;
            z-index: 3;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 14px;
            border: 1px solid var(--border-color);
            border-radius: 100px;
            font-size: 12px;

    <script>
        // ============================================================
        // PARTICLES
        // ============================================================
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let particleCount = 60;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                gradient.addColorStop(0, 'rgba(0, 188, 212, ' + this.opacity + ')');
                gradient.addColorStop(1, 'rgba(38, 166, 154, ' + this.opacity * 0.5 + ')');
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = 'rgba(0, 188, 212, ' + (0.08 * (1 - distance / 150)) + ')';
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update();
                p.draw(); });
            connectParticles();
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

            // Typing effect
            const words = ['Siswa TJKT SMKN 1 Losarang', 'Network Enthusiast', 'Web Developer', 'Python & Linux Learner'];

                        typingText.textContent = current.substring(0, j - 1);

            });
        });
        mobileLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                switchPage(this.dataset.page);
            });
        });

        window.switchPage = switchPage;

        // ============================================================
        // MOBILE SIDEBAR
        // ============================================================
        const burgerBtn = document.getElementById('burgerBtn');
        const mobileSidebar = document.getElementById('mobileSidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const sidebarClose = document.getElementById('sidebarClose');

        function openSidebar() {
            mobileSidebar.classList.add('open');
            sidebarOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            burgerBtn.innerHTML = '<i class="fas fa-times"></i>';
        }

        function closeSidebar() {
            mobileSidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
            document.body.style.overflow = '';
            burgerBtn.innerHTML = '<i class="fas fa-bars"></i>';
        }

        burgerBtn.addEventListener('click', () => {
            mobileSidebar.classList.contains('open') ? closeSidebar() : openSidebar();
        });
        sidebarClose.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && mobileSidebar.classList.contains('open')) closeSidebar();
        });

        // ============================================================
        // THEME TOGGLE
        // ============================================================
        const html = document.documentElement;
        const desktopThemeToggle = document.getElementById('desktopThemeToggle');
        const mobileThemeToggle = document.getElementById('mobileThemeToggle');
        const desktopThemeIcon = document.getElementById('desktopThemeIcon');
        const mobileThemeIcon = document.getElementById('mobileThemeIcon');
        const sidebarThemeSwitch = document.getElementById('sidebarThemeSwitch');

        function setTheme(isLight) {
            if (isLight) {
                html.setAttribute('data-theme', 'light');
                desktopThemeIcon.className = 'fas fa-sun';
                mobileThemeIcon.className = 'fas fa-sun';
                sidebarThemeSwitch.checked = true;
                localStorage.setItem('theme', 'light');
            } else {
                html.removeAttribute('data-theme');
                desktopThemeIcon.className = 'fas fa-moon';
                mobileThemeIcon.className = 'fas fa-moon';
                sidebarThemeSwitch.checked = false;
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'light') setTheme(true);

        desktopThemeToggle.addEventListener('click', () => setTheme(html.getAttribute('data-theme') !== 'light'));
        mobileThemeToggle.addEventListener('click', () => setTheme(html.getAttribute('data-theme') !== 'light'));
        sidebarThemeSwitch.addEventListener('change', function() { setTheme(this.checked); });

        // ============================================================
        // HASH ROUTING
        // ============================================================
        function loadFromHash() {
            const hash = window.location.hash.replace('#', '');
            if (hash && pages[hash]) {
                [...desktopLinks, ...mobileLinks].forEach(link => {
                    link.classList.toggle('active', link.dataset.page === hash);
                });
                Object.keys(pages).forEach(key => {
                    pages[key].classList.toggle('active', key === hash);
                });
            }
        }

        window.addEventListener('hashchange', loadFromHash);
        window.addEventListener('load', function() {
            if (!window.location.hash) switchPage('home');
            else loadFromHash();
        });

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.altKey && e.key >= '1' && e.key <= '4') {
                e.preventDefault();
                const pages = ['home', 'about', 'project', 'certificate'];
                switchPage(pages[parseInt(e.key) - 1]);
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        loadData();
        console.log('🚀 Portfolio v3.0 — Ikon Variatif & Keren!');
        console.log('📝 Edit data.json untuk mengubah konten');
    </script>

</body>
</html>
